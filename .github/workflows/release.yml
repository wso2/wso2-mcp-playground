name: Release

on:
  workflow_dispatch:
    inputs:
      Type:
        description: 'Choose which version to bump before release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Two releases from the same branch would race for the same version number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WSO2_APIM_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm 11.15.0 or newer; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Configure git
        run: |
          git config --global user.email "${{ secrets.WSO2_APIM_BOT_EMAIL }}"
          git config --global user.name "${{ secrets.WSO2_APIM_BOT_USERNAME }}"

      # Commit and tag locally only; they are pushed after the package is staged, so a
      # failed release leaves nothing behind on the branch.
      - name: Bump version and create tag
        id: version
        run: |
          npm version ${{ github.event.inputs.Type }}
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The trusted publisher only allows staged publishes. A maintainer approves the
      # staged version with 2FA on npmjs.com (Staged Packages) or with `npm stage approve`.
      - name: Stage package on npm
        run: npm stage publish --access public --verbose

      # --atomic pushes the version commit and its tag together, or neither.
      - name: Push version commit and tag
        run: git push --atomic origin "HEAD:${{ github.ref_name }}" "${{ steps.version.outputs.tag }}"
